spring.application.name=expense-tracker-backend
server.port=8080

# ==============================================================================
# SUPABASE POSTGRESQL DATABASE CONFIGURATION
# ==============================================================================
# Steps to connect to your Supabase project:
# 1. Log in to https://supabase.com/dashboard and open your project.
# 2. Go to: Project Settings (gear icon) -> Database
# 3. Under "Connection string", select "JDBC" or "URI".
# 4. Paste your JDBC URL and Database password below:
# ==============================================================================

# Option 1: Direct Connection (Default port 5432)
# Configured with your Supabase credentials:
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.iocbkxmnsedtqijbopth.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:Vishwajit123@shinde}
spring.datasource.driver-class-name=org.postgresql.Driver

# Option 2: If using Supabase Connection Pooler (Port 6543 / 5432, ideal for IPv4 networks):
# spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
# spring.datasource.username=postgres.YOUR_PROJECT_REF
# spring.datasource.password=YOUR_SUPABASE_PASSWORD

# ==============================================================================
# JPA / Hibernate PostgreSQL Settings
# ==============================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP Cloud Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

# ==============================================================================
# Offline / Local Fallback Database (Optional: H2 embedded mode)
# If you want to run offline without internet, activate: spring.profiles.active=local
# ==============================================================================
spring.h2.console.enabled=false

# Initial Data Source & Migration File
expense.storage.filepath=../expense.txt

