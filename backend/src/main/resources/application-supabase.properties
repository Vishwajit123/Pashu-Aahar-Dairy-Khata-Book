# ========================================================
# SUPABASE POSTGRESQL CLOUD DATABASE CONFIGURATION
# ========================================================
# To activate this profile, set:
# spring.profiles.active=supabase
# or run with: mvn spring-boot:run -Dspring-boot.run.profiles=supabase
# ========================================================

# Supabase JDBC URL
# Direct connection (Port 5432):
# spring.datasource.url=jdbc:postgresql://db.<PROJECT-REF>.supabase.co:5432/postgres?sslmode=require
#
# Connection Pooler (Port 6543 / 5432 - recommended if your network uses IPv4):
# spring.datasource.url=jdbc:postgresql://aws-0-<REGION>.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:YOUR_SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Dialect & Hibernate DDL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP Connection Pool Settings (Optimized for Supabase Cloud)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# Disable H2 console when using Supabase
spring.h2.console.enabled=false

# Legacy migration file path (optional)
expense.storage.filepath=../expense.txt
